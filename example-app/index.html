<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>@capgo/capacitor-file-picker</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-file-picker</h1>
      <p class="lead">Pick files or media from the native file picker.</p>
      <div class="actions">
        <button id="pick-files">Pick Files</button>
        <button id="pick-media" class="secondary">Pick Media</button>
        <button id="get-version" class="secondary">Plugin Version</button>
      </div>
      <pre id="output">Choose an action to inspect picker results.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
